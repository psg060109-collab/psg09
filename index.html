<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#140d09">
  <title>불판 대첩</title>
  <link rel="preload" href="fonts/Galmuri11-Bold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="game" width="640" height="360" aria-label="불판 대첩 게임 화면"></canvas>
  <!-- 휴대폰에서 이름 입력 (최단 승리 TOP 5) -->
  <form id="name-form" hidden>
    <input id="name-input" maxlength="3" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="ABC" aria-label="이름 (영문·숫자 3자)">
    <button type="submit">저장</button>
    <button type="button" id="name-skip">건너뛰기</button>
  </form>
  <div id="rotate">휴대폰을 가로로 돌려 주세요</div>
  <noscript>이 게임은 자바스크립트가 필요합니다.</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
